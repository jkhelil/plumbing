---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slash-command-kind
  namespace: tekton-ci
spec:
  params:
    - name: package
      description: "org/repo e.g. tektoncd/plumbing"
    - name: pullRequestNumber
      description: PR number
    - name: pullRequestUrl
      description: HTML URL of the pull request
    - name: commenter
      description: GitHub login of the user who posted the command
    - name: slashCommand
      description: Full comment body e.g. "/ci kind bug" or "/ci remove-kind bug"
  steps:
    - name: kind
      image: ghcr.io/tektoncd/plumbing/gh-cli:latest
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: bot-token-github
              key: bot-token
        - name: PACKAGE
          value: $(params.package)
        - name: PR
          value: $(params.pullRequestNumber)
        - name: COMMAND
          value: $(params.slashCommand)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        COMMAND="$(printf '%s' "${COMMAND}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        if [[ "${COMMAND}" =~ ^/ci\ kind\ ([A-Za-z0-9][-A-Za-z0-9]*)$ ]]; then
          ACTION="add"
          KIND="${BASH_REMATCH[1]}"
        elif [[ "${COMMAND}" =~ ^/ci\ remove-kind\ ([A-Za-z0-9][-A-Za-z0-9]*)$ ]]; then
          ACTION="remove"
          KIND="${BASH_REMATCH[1]}"
        else
          echo "unsupported slash command: ${COMMAND}" >&2
          exit 1
        fi

        LABEL="kind/${KIND}"

        [[ "${PACKAGE}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
          || { echo "invalid package: ${PACKAGE}" >&2; exit 1; }
        [[ "${PR}" =~ ^[0-9]+$ ]] \
          || { echo "invalid PR number: ${PR}" >&2; exit 1; }

        API="/repos/${PACKAGE}/issues/${PR}/labels"

        if [[ "${ACTION}" == "add" ]]; then
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "${API}" \
            -f "labels[]=${LABEL}" >/dev/null
          echo "Added '${LABEL}' to ${PACKAGE}#${PR}"
        else
          ENCODED_LABEL="${LABEL//\//%2F}"
          if OUT="$(gh api --method DELETE \
                      -H "Accept: application/vnd.github+json" \
                      "${API}/${ENCODED_LABEL}" 2>&1)"; then
            echo "Removed '${LABEL}' from ${PACKAGE}#${PR}"
          elif grep -qE 'HTTP 404|Not Found|"status": ?"404"' <<<"${OUT}"; then
            echo "'${LABEL}' not present on ${PACKAGE}#${PR}, nothing to do"
          else
            echo "${OUT}" >&2
            exit 1
          fi
        fi
